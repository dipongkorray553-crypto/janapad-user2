name: Build JANAPAD APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o janapad-user-android.zip -d extracted
          ROOT_DIR=$(dirname "$(find extracted -name 'settings.gradle.kts' | head -n 1)")
          echo "Found project root at: $ROOT_DIR"
          mv "$ROOT_DIR" project
          ls -la project

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > project/app/google-services.json
            echo "Firebase config added."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not found."
          fi

      - name: Build Debug APK
        working-directory: project
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JANAPAD-User-Debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
